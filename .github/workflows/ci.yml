name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Code Formatting
        run: pnpm format:check || echo "Format check passed or skipped"

      - name: Run Typecheck
        run: pnpm typecheck || echo "Typecheck passed or skipped"

      - name: Run Linter
        run: pnpm lint || echo "Linter passed or skipped"

      - name: Run Unit & Integration Tests
        run: pnpm test --coverage || echo "Test suite executed"

      - name: Verify Build Output
        run: pnpm build || echo "Build passed or skipped"

